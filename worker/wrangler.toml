name = "filmder-proxy"
main = "index.js"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "SYNC"
id = "ВСТАВЬТЕ_ID_ИЗ_КОМАНДЫ_kv_namespace_create"

[vars]
ALLOWED_ORIGIN = "https://ВАШ-САЙТ"

[[durable_objects.bindings]]
