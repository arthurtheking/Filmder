name: Update version

# Номер версии = BASE + количество коммитов, рядом короткий хеш коммита.
# Меняйте BASE вручную (например 1.1 или 2.0), когда хотите поднять «мажор».
on:
  push:
    branches: [main, master]
    paths-ignore:
      - scripts/version.js

permissions:
  contents: write

concurrency:
  group: update-version
  cancel-in-progress: false

env:
  BASE: "0.3"

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate scripts/version.js
        run: |
          # коммиты самого бота в счётчик не входят, иначе версия прыгала бы через один
          COUNT=$(git rev-list --count --invert-grep --grep="chore: version" HEAD)
          SHA=$(git rev-parse --short HEAD)
          DATE=$(TZ=Europe/Kyiv date +%Y-%m-%d)
          printf 'window.APP_VERSION = { version: "%s.%s", sha: "%s", date: "%s" };\n' "$BASE" "$COUNT" "$SHA" "$DATE" > scripts/version.js
          echo "VERSION=$BASE.$COUNT" >> "$GITHUB_ENV"
          cat scripts/version.js

      - name: Commit version.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/version.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: version $VERSION [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
